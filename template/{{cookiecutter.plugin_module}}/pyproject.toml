[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{ cookiecutter.distribution_name }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "{{ cookiecutter.full_name }}", email = "{{ cookiecutter.email }}" }]
dependencies = [
  "earthaccess-plugin-spec{{ cookiecutter.spec_version }}",
{% if cookiecutter.backend_package %}  "{{ cookiecutter.backend_package }}",
{% endif %}]

[project.entry-points."earthaccess.plugins"]
{{ cookiecutter.plugin_name }} = "{{ cookiecutter.plugin_module }}:{{ cookiecutter.plugin_class }}"

[project.optional-dependencies]
test = ["pytest >=8.0", "mypy >=1.11", "ruff >=0.6"]

[project.urls]
Repository = "https://github.com/{{ cookiecutter.github_user }}/{{ cookiecutter.distribution_name }}"

# The contract lives on GitHub until it is published to PyPI.
[tool.uv.sources]
earthaccess-plugin-spec = { git = "https://github.com/earthaccess-dev/earthaccess-plugin-spec.git", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.plugin_module }}"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
disallow_untyped_defs = true
pretty = true

[[tool.mypy.overrides]]
module = ["pytest", "pytest.*"{% if cookiecutter.backend_package %}, "{{ cookiecutter.backend_package }}", "{{ cookiecutter.backend_package }}.*"{% endif %}]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
